image: rust:1.47.0-buster@sha256:48f4b36c3f3492b82a5e14b2fc991d3163c1d2ce18ac1f0561e9657103192713

# Set any required environment variables here
variables:
  RUST_BACKTRACE: FULL
  GIT_SUBMODULE_STRATEGY: recursive
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  DOCKER_BUILDKIT: 1
  DOCKER_CLI_EXPERIMENTAL: enabled
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  FF_NETWORK_PER_BUILD: "true"


stages:
  - version
  - build
  - image
  - release
  - deploy

version:
  stage: version
  image: registry.gitlab.com/juhani/go-semrel-gitlab:v0.19.0@sha256:37d80d80bf4c2c6b7111092902d90be796e617fed5438eaddfac4a1f89c26685
  script:
    - release next-version --bump-patch > .next-version
  artifacts:
    paths:
      - .next-version
  except:
    - tags

pre-release:
  stage: build
  image: docker:29-cli@sha256:5e6baf67325a79f64ed3bed6863954d5e05d0f3d4e57cbdb14809346814bbfdb
  before_script:
    - mkdir -p ~/.docker
    - printf '%s' "$DOCKER_AUTH_CONFIG" > ~/.docker/config.json
  script:
    - docker build .
  only:
    - branches
  except:
    - master

build-image:
  stage: image
  image: docker:29-cli@sha256:5e6baf67325a79f64ed3bed6863954d5e05d0f3d4e57cbdb14809346814bbfdb
  before_script:
    - mkdir -p ~/.docker
    - printf '%s' "$DOCKER_AUTH_CONFIG" > ~/.docker/config.json
  script:
    - rm -f build_info
    - echo "RELEASE_URL=https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/jobs/$CI_JOB_ID/artifacts/release" > build_info
    - echo "RELEASE_DESC=\"$(uname -mo) binary\"" >> build_info
    - echo "RELEASE_SHA=$CI_COMMIT_SHA" >> build_info
    - echo "RELEASE_VERSION=$(cat .next-version)" >> build_info
    - . build_info

    # Build cuda image
    - docker build -t $CI_REGISTRY_IMAGE:v$RELEASE_VERSION .
    - docker build -t $CI_REGISTRY_IMAGE:latest .
    - docker push $CI_REGISTRY_IMAGE:v$RELEASE_VERSION
    - docker push $CI_REGISTRY_IMAGE:latest
  artifacts:
    paths:
      - build_info
  only:
    - master

release:
  stage: release
  image: registry.gitlab.com/juhani/go-semrel-gitlab:v0.21.1@sha256:9bde0390b066498c3fe3065971651e4e7a3f34c3dbabc0ac7f85b33d9a693fdb
  script:
    - rm -f release_info
    - mv build_info release_info
    - . release_info

    - release -v
    - release --bump-patch changelog
    - release --bump-patch commit-and-tag CHANGELOG.md release_info
    - release --bump-patch --ci-commit-tag v$RELEASE_VERSION add-download-link -n release -u $RELEASE_URL -d "$RELEASE_DESC"
  artifacts:
    paths:
      - release_info
  only:
    - master
